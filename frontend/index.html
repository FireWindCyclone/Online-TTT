<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Online Tic Tac Toe</title>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body class="v-con">
		<header class="v-con">
			<h1>Tic-Tac-Toe</h1>
			<p class="game-status" aria-live="polite">
				Create or join a game to play with friends online
			</p>
			<div class="h-con">
				<button class="btn create-game" type="button">Create</button>
				<button class="btn join-game" type="button">Join</button>
			</div>
		</header>

		<section>
			<dialog class="v-con create-panel">
				<p class="game-status" aria-live="polite">Creating game...</p>
				<button class="btn game-id" type="button">Code</button>
				<button class="btn" type="button">Close</button>
			</dialog>

			<dialog class="v-con join-panel">
				<p class="game-status" aria-live="polite">Enter game code to join</p>
				<form class="v-con">
					<input class="code-input" type="text" placeholder="Code" required>
					<button class="btn" type="submit">Enter</button>
				</form>
				<button class="btn" type="button">Close</button>
			</dialog>
		</section>

		<main class="v-con">
			<ul class="h-con player-type">
				<li>You (X)</li>
				<li>Opponent (O)</li>
			</ul>

			<div class="board">
				<button class="cell" data-index="0" type="button"></button>
				<button class="cell" data-index="1" type="button"></button>
				<button class="cell" data-index="2" type="button"></button>
				<button class="cell" data-index="3" type="button"></button>
				<button class="cell" data-index="4" type="button"></button>
				<button class="cell" data-index="5" type="button"></button>
				<button class="cell" data-index="6" type="button"></button>
				<button class="cell" data-index="7" type="button"></button>
				<button class="cell" data-index="8" type="button"></button>
			</div>

			<button class="btn reset-game" type="button">Clear</button>
		</main>
	</body>
</html>
