<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Online Tic Tac Toe</title>
		<script type="module" src="/src/main.ts"></script>
	</head>
	<body>
		<header>
			<h1>Tic-Tac-Toe</h1>
			<p class="game-status">
				Create or join a game to play with friends online
			</p>
			<div class="header-buttons">
				<button class="create-game" type="button">Create</button>
				<button class="join-game" type="button">Join</button>
			</div>
		</header>

		<section class="create-panel" hidden>
			<p class="game-status">Creating...</p>
			<button id="game-id" type="button">Code</button>
			<button type="button">Close</button>
		</section>

		<section class="join-panel" hidden>
			<p class="game-status">Enter game code to join</p>
			<input class="code-input" type="text" maxlength="4" placeholder="Code">
			<button type="button">Join</button>
		</section>

		<main>
			<ul class="player-type">
				<li>You (X)</li>
				<li>Opponent (O)</li>
			</ul>

			<div class="board">
				<button class="cell" data-index="0" type="button"></button>
				<button class="cell" data-index="1" type="button"></button>
				<button class="cell" data-index="2" type="button"></button>
				<button class="cell" data-index="3" type="button"></button>
				<button class="cell" data-index="4" type="button"></button>
				<button class="cell" data-index="5" type="button"></button>
				<button class="cell" data-index="6" type="button"></button>
				<button class="cell" data-index="7" type="button"></button>
				<button class="cell" data-index="8" type="button"></button>
			</div>

			<button class="reset-game" type="button">Clear</button>
		</main>
	</body>
</html>
